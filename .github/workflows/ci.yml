# ==========================================
# CI — kiểm tra mỗi lần push / pull request
#   backend  : ruff (format + lint) + pytest (kiểm thử đơn vị)
#   frontend : ESLint (bắt lỗi: biến chưa khai báo, hook React, mã chết) + build production
#   e2e      : dựng toàn bộ stack bằng Docker Compose (dữ liệu mẫu + mô phỏng), chạy 12 bộ kiểm thử API
#   prod     : dựng docker-compose.prod.yml trên CSDL trống (không demo, không mô phỏng, bắt buộc 2 lớp), thử trọn luồng
# ==========================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend – ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Ruff format
        run: ruff format --check app tests alembic
      - name: Ruff lint
        run: ruff check app tests alembic
      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend – lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - run: npm run build

  e2e:
    name: E2E – Docker Compose + kiểm thử API
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    env:
      JWT_SECRET: ci-jwt-secret-${{ github.run_id }}
      SECRET_KEY: ci-secret-key-${{ github.run_id }}
      OPEN_METEO_ENABLED: "true"
      # Kiểm thử API dùng tài khoản demo + dữ liệu mẫu + bộ mô phỏng
      DEMO_MODE: "true"
      SIMULATOR: "true"
      # vai trò thử của totp-test.mjs: kiểm tra luồng bắt buộc cài xác thực 2 lớp khi đăng nhập
      TOTP_REQUIRED_ROLES: kiem_thu_2fa
      # ops-test.mjs: ngưỡng ổ đĩa 1% → giả lập ổ đĩa đầy, thử trọn luồng cảnh báo sự cố (email tới Mailpit, 503)
      OPS_DISK_WARN_PCT: "1"
      OPS_ALERT_EMAILS: van-hanh@ci.local
      # smoke.mjs: webhook SOS (Zalo / app) gửi lại cùng mã tin → không tạo phiếu thứ hai
      INTAKE_API_KEY: ci-intake-key-${{ github.run_id }}-khoa-thu-nghiem
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Kiểm tra cấu hình triển khai thật (docker-compose.prod.yml)
        run: |
          # tệp mẫu còn trống bí mật → compose phải báo lỗi (không dùng "! lệnh": bash -e bỏ qua lệnh bị phủ định)
          if docker compose -f docker-compose.prod.yml --env-file .env.production.example config -q 2>/dev/null; then
            echo "docker-compose.prod.yml chấp nhận cấu hình thiếu bí mật — phải dùng \${VAR:?…}"; exit 1
          fi
          # điền đủ bí mật → cấu hình hợp lệ
          cp .env.production.example ci.prod.env
          cat >> ci.prod.env <<EOF
          DOMAIN=pctt.ci.local
          ACME_EMAIL=ci@ci.local
          JWT_SECRET=$(openssl rand -hex 32)
          SECRET_KEY=$(openssl rand -hex 32)
          SUPERADMIN_EMAIL=ci@ci.local
          SUPERADMIN_PASSWORD=Ci-Pass-$(openssl rand -hex 8)
          SUPERADMIN_PIN=480193
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)
          SMTP_HOST=smtp.ci.local
          BACKUP_REMOTE=offsite:pctt/ci
          EOF
          docker compose -f docker-compose.prod.yml --env-file ci.prod.env --profile caddy --profile mqtt --profile offsite config -q
          rm ci.prod.env
      - name: Build & khởi động stack
        run: docker compose up -d --build --wait --wait-timeout 600 db redis minio mailpit mqtt backend worker frontend
      - name: Chờ dữ liệu đầu tiên (mô phỏng + đồng bộ dự báo)
        run: sleep 45
      - name: Kiểm thử luồng nghiệp vụ
        run: node tests/e2e/smoke.mjs
      - name: Kiểm thử phân quyền RBAC
        run: node tests/e2e/rbac-test.mjs
      - name: Kiểm thử IoT & nguồn dữ liệu
        run: node tests/e2e/iot-test.mjs
      - name: Kiểm thử cổng công khai, phản ánh, tài khoản
        run: node tests/e2e/public-test.mjs
      - name: Kiểm thử xác thực 2 lớp (TOTP)
        run: |
          # public-test đăng nhập nhiều lần (cả thử khoá tài khoản) → xoá bộ đếm giới hạn đăng nhập 30/phút/IP
          docker compose exec -T redis sh -c "redis-cli --scan --pattern 'rl:*' | xargs -r redis-cli del"
          node tests/e2e/totp-test.mjs
      - name: Kiểm thử tra cứu tiến độ phiếu
        run: |
          docker compose exec -T redis sh -c "redis-cli --scan --pattern 'rl:*' | xargs -r redis-cli del"
          node tests/e2e/track-test.mjs
      # Trước các bộ thay dữ liệu (import-test): cần lực lượng, phiếu SOS, phản ánh của dữ liệu mẫu
      - name: Kiểm thử giao diện bằng trình duyệt (máy tính + điện thoại)
        run: |
          docker compose exec -T redis sh -c "redis-cli --scan --pattern 'rl:*' | xargs -r redis-cli del"
          cd tests/ui
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          UI_SHOTS=shots node ui-test.mjs http://localhost:8080
      - name: Ảnh chụp bước giao diện lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: tests/ui/shots
          if-no-files-found: ignore
      - name: Kiểm thử hồ chứa & điểm đen sạt lở
        run: |
          node tests/e2e/reservoir-test.mjs
          node tests/e2e/landslide-test.mjs
      - name: Kiểm thử nhập dữ liệu (có bước thay toàn bộ — chạy sau các bộ dùng dữ liệu mẫu)
        run: node tests/e2e/import-test.mjs
      - name: Kiểm thử xã/phường gửi dữ liệu → cấp tỉnh phê duyệt
        run: node tests/e2e/submission-test.mjs
      - name: Kiểm thử bản nhẹ /ban-nhe & service worker (qua nginx của frontend)
        run: node tests/e2e/lite-test.mjs
      - name: Kiểm thử tự giám sát vận hành (/health/full, email cảnh báo sự cố)
        run: node tests/e2e/ops-test.mjs
      - name: Log khi lỗi
        if: failure()
        run: docker compose logs --tail=300 backend worker frontend
      - name: Dọn dẹp
        if: always()
        run: docker compose down -v

  prod:
    name: Production – CSDL trống, không demo / mô phỏng
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    env:
      DC: docker compose -f docker-compose.prod.yml -f ci.prod.override.yml --env-file ci.prod.env
      SUPERADMIN_PIN: "480193"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Cấu hình production thử (bí mật ngẫu nhiên, email vào Mailpit)
        run: |
          SUPERADMIN_PASSWORD="Ci-Prod-$(openssl rand -hex 8)-9"
          echo "::add-mask::${SUPERADMIN_PASSWORD}"
          echo "SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}" >> "$GITHUB_ENV"
          # dòng sau ghi đè dòng cùng tên trong tệp mẫu; tài nguyên thu nhỏ cho máy CI (16 GB)
          cp .env.production.example ci.prod.env
          cat >> ci.prod.env <<EOF
          DOMAIN=pctt.ci.local
          ACME_EMAIL=ci@ci.local
          JWT_SECRET=$(openssl rand -hex 32)
          SECRET_KEY=$(openssl rand -hex 32)
          SUPERADMIN_EMAIL=ci@ci.local
          SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
          SUPERADMIN_PIN=${SUPERADMIN_PIN}
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          SMTP_STARTTLS=false
          OPS_ALERT_EMAILS=van-hanh@ci.local
          OPS_DISK_WARN_PCT=99
          BACKUP_DIR=./ci-backups
          BACKUP_REMOTE=offsite:pctt/ci
          POSTGRES_SHARED_BUFFERS=512MB
          POSTGRES_EFFECTIVE_CACHE_SIZE=2GB
          POSTGRES_MAINTENANCE_WORK_MEM=128MB
          DB_MEM_LIMIT=3g
          BACKEND_MEM_LIMIT=2g
          API_WORKERS=2
          EOF
          # Mailpit chỉ có ở CI: bắt email đặt lại mật khẩu / cảnh báo sự cố (không có trong docker-compose.prod.yml)
          cat > ci.prod.override.yml <<'EOF'
          services:
            mailpit:
              image: axllent/mailpit:latest
              networks: [default]
              ports: ["127.0.0.1:8025:8025"]
          EOF
      - name: Build & khởi động stack production (CSDL trống)
        run: |
          $DC up -d --build backend worker frontend backup mailpit
          # migrate chạy 1 lần (alembic + dữ liệu nền) → backend healthy → worker, frontend
          for i in $(seq 1 90); do
            w=$(docker inspect --format '{{.State.Health.Status}}' caobang-pctt-prod-worker-1 2>/dev/null || true)
            if [ "$w" = "healthy" ] && curl -fsS -o /dev/null http://127.0.0.1:8080/api/v1/public/config; then
              echo "Stack sẵn sàng sau ~$((i * 10)) giây"; exit 0
            fi
            sleep 10
          done
          echo "Stack không sẵn sàng sau 15 phút"; $DC ps; exit 1
      - name: Kiểm thử luồng vận hành thật
        run: node tests/e2e/prod-flow.mjs http://127.0.0.1:8080 http://127.0.0.1:8025
      # prod-flow vừa nhập tệp mẫu (CB-LL-001…) → golive phải NO-GO và chỉ ra bản ghi mẫu; không phần nào lỗi giữa chừng
      - name: Kiểm tra Go / No-Go (deploy/golive-check.sh)
        run: |
          set +e
          DCP="$DC" sh deploy/golive-check.sh http://frontend:80 > golive.log 2>&1
          code=$?
          set -e
          cat golive.log
          [ "$code" -eq 1 ] || { echo "Phải NO-GO: còn dữ liệu mẫu của prod-flow"; exit 1; }
          grep -q "Còn bản ghi mẫu CB-LL-001" golive.log || { echo "Không phát hiện bản ghi mẫu"; exit 1; }
          ! grep -q "Không kiểm tra được" golive.log || { echo "Có phần kiểm tra bị lỗi giữa chừng"; exit 1; }
          for t in T1 T2 T3 T5; do
            grep -q "^ĐẠT *$t " golive.log || { echo "Kịch bản đối kháng $t không đạt"; exit 1; }
          done
      - name: Log khi lỗi
        if: failure()
        run: $DC logs --tail=300 migrate backend worker frontend backup
      - name: Dọn dẹp
        if: always()
        run: $DC down -v
