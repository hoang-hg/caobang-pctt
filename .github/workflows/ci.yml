# ==========================================
# CI — kiểm tra mỗi lần push / pull request
#   backend  : ruff (format + lint) + pytest (kiểm thử đơn vị)
#   frontend : build production
#   e2e      : dựng toàn bộ stack bằng Docker Compose, chạy 4 bộ kiểm thử API
# ==========================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend – ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Ruff format
        run: ruff format --check app tests alembic
      - name: Ruff lint
        run: ruff check app tests alembic
      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend – build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  e2e:
    name: E2E – Docker Compose + kiểm thử API
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    env:
      JWT_SECRET: ci-jwt-secret-${{ github.run_id }}
      SECRET_KEY: ci-secret-key-${{ github.run_id }}
      OPEN_METEO_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build & khởi động stack
        run: docker compose up -d --build --wait --wait-timeout 600 db redis minio mailpit mqtt backend worker
      - name: Chờ dữ liệu đầu tiên (mô phỏng + đồng bộ dự báo)
        run: sleep 45
      - name: Kiểm thử luồng nghiệp vụ
        run: node scripts/smoke.mjs
      - name: Kiểm thử phân quyền RBAC
        run: node scripts/rbac-test.mjs
      - name: Kiểm thử IoT & nguồn dữ liệu
        run: node scripts/iot-test.mjs
      - name: Kiểm thử cổng công khai, phản ánh, tài khoản
        run: node scripts/public-test.mjs
      - name: Log khi lỗi
        if: failure()
        run: docker compose logs --tail=300 backend worker
      - name: Dọn dẹp
        if: always()
        run: docker compose down -v
