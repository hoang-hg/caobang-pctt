# ==========================================
# Deploy — build & push Docker image lên GitHub Container Registry khi tạo tag phiên bản
#   git tag v1.0.0 && git push origin v1.0.0
# Máy chủ: cd /opt/caobang-pctt && sh deploy/update.sh X.Y.Z  (sao lưu → kéo image → cập nhật → kiểm tra → tự quay lại; README 10.4)
# Chỉ gắn tag cho commit đã gộp vào main (đã qua CI) — job dừng nếu tag nằm ngoài main.
# (mô hình GitOps giống thientai-org: máy chủ không build, chỉ kéo image đã kiểm thử)
# ==========================================
name: Deploy

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Chỉ phát hành commit đã gộp vào main (đã qua CI)
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag $GITHUB_REF_NAME không nằm trên main — chỉ gắn tag cho commit đã gộp (đã qua CI)"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/caobang-pctt-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
