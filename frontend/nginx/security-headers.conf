# Header bảo mật cơ bản. HSTS đặt ở nơi kết thúc HTTPS (Caddyfile). Chưa bật Content-Security-Policy: giao diện tải
# bản đồ nền, radar, font từ nhiều nguồn — cần lập danh sách nguồn và thử kỹ trước khi bật (README.md mục 10).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self)" always;
