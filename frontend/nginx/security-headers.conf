# Header bảo mật cơ bản. HSTS đặt ở nơi kết thúc HTTPS (Caddyfile).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self)" always;
# Content-Security-Policy (README 11): trình duyệt chỉ chạy mã / tải tài nguyên từ chính trang và các nguồn liệt kê →
# chèn được mã độc (XSS) cũng không tải thêm script lạ hay gửi dữ liệu ra ngoài.
#   script-src  'sha256-…' = script đặt theme trong index.html — sửa script đó thì build báo mã băm mới (vite.config.js);
#               challenges.cloudflare.com = Turnstile (form phản ánh, cả frame-src)
#   img-src     nền bản đồ Google / CARTO (components/map/MapTools.jsx), radar RainViewer; blob: = xem trước ảnh phản ánh
#   connect-src API RainViewer; ws(s)://$host = WebSocket /ws (trình duyệt cũ không tính ws/wss vào 'self')
#   style-src   'unsafe-inline': Leaflet và React đặt style trực tiếp trên phần tử
# Thêm nguồn ngoài mới (nền bản đồ, API gọi từ trình duyệt…) → thêm vào đây và thử lại với Chrome (README 11).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-WFqimtdW3Po/khmitaV+5jr0oaSg/FhVr6QtbriGtc4=' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google.com https://*.basemaps.cartocdn.com https://tilecache.rainviewer.com; font-src 'self'; connect-src 'self' wss://$host ws://$host https://api.rainviewer.com; frame-src https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
