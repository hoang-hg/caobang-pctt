# Lấy IP thật của người dùng từ X-Forwarded-For — CHỈ khi kết nối đến từ proxy được tin dưới đây.
# Mặc định: proxy chạy cùng máy / cùng mạng nội bộ (Caddy trong docker-compose.prod.yml, HAProxy/nginx của trung tâm dữ liệu).
# Đặt Cloudflare phía trước: thay các dòng dưới bằng dải IP Cloudflare (https://www.cloudflare.com/ips/)
# và dùng "real_ip_header CF-Connecting-IP;". Mount tệp thay thế vào /etc/nginx/snippets/real-ip.conf.
# Cổng của nginx KHÔNG được mở thẳng ra Internet khi đã có proxy phía trước (người trong dải tin cậy giả được IP).
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
