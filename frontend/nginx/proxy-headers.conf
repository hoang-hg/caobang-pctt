# Header gửi tới backend. X-Forwarded-For bị GHI ĐÈ bằng đúng 1 IP ($remote_addr đã qua real_ip) — không nối thêm
# giá trị client tự gửi, nên không thể giả mạo IP để vượt giới hạn tần suất (backend tin nginx qua TRUSTED_PROXIES).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
