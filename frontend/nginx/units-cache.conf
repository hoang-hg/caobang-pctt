# Cache ngắn cho dữ liệu hành chính dùng chung (danh sách xã, ranh giới xã / tỉnh — backend/app/api/v1/admin_units.py,
# không cần đăng nhập, không phụ thuộc người xem). Cổng công khai gọi các đường dẫn này MỖI lần mở trang: không cache thì
# mỗi lượt tải tốn backend ~65 ms (ranh giới xã ~170 KB) và bị tính vào giới hạn 600 yêu cầu/phút/IP — sau IP dùng chung
# của nhà mạng (CGNAT) vài trăm người mở cổng cùng lúc là bị 429. Giống public-cache.conf, khoá riêng chỉ gồm tham số các
# route này dùng: thêm tham số GET mới cho /api/v1/admin-units → PHẢI thêm vào đây
# (backend/tests/test_production_hardening.py kiểm tra).
proxy_pass http://backend:8000;
include /etc/nginx/snippets/proxy-headers.conf;
proxy_cache public_api;
proxy_cache_methods GET HEAD;
proxy_cache_key "units|$request_method$uri|level=$arg_level|admin_codes=$arg_admin_codes";
proxy_cache_valid 200 10s;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
add_header X-Cache-Status $upstream_cache_status always;
include /etc/nginx/snippets/security-headers.conf;  # add_header trong location không kế thừa từ server
