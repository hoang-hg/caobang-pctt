# Cache ngắn cho nội dung công khai (API /api/v1/public/, trang bản nhẹ /ban-nhe): mỗi URL chỉ tạo ~1 yêu cầu/10 giây
# vào backend; backend lỗi hoặc quá tải thì vẫn trả bản gần nhất (stale). Chỉ GET/HEAD; POST đi thẳng.
proxy_pass http://backend:8000;
include /etc/nginx/snippets/proxy-headers.conf;
proxy_cache public_api;
proxy_cache_methods GET HEAD;
proxy_cache_key $request_method$request_uri;
proxy_cache_valid 200 10s;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
add_header X-Cache-Status $upstream_cache_status always;
include /etc/nginx/snippets/security-headers.conf;  # add_header trong location không kế thừa từ server
