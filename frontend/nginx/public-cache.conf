# Cache ngắn cho nội dung công khai (API /api/v1/public/, trang bản nhẹ /ban-nhe): mỗi URL chỉ tạo ~1 yêu cầu/10 giây
# vào backend; backend lỗi hoặc quá tải thì vẫn trả bản gần nhất (stale). Chỉ GET/HEAD; POST đi thẳng.
proxy_pass http://backend:8000;
include /etc/nginx/snippets/proxy-headers.conf;
proxy_cache public_api;
proxy_cache_methods GET HEAD;
# Khoá cache CHỈ gồm các tham số API công khai thật sự dùng: tham số lạ (?_=ngẫu_nhiên) không tạo bản cache mới nên
# không né được cache để dồn tải vào backend. Thêm tham số GET mới cho /api/v1/public/* → PHẢI thêm vào đây, nếu
# không các giá trị khác nhau dùng chung 1 bản cache (trả sai dữ liệu) — backend/tests/test_production_hardening.py
# kiểm tra. /ban-nhe được rewrite thành /api/v1/public/lite trước → $uri giống nhau, dùng chung bản cache.
proxy_cache_key "$request_method$uri|days=$arg_days|hours=$arg_hours|xa=$arg_xa|thumb=$arg_thumb|lat=$arg_lat|lon=$arg_lon|from=$arg_from_lat,$arg_from_lon|to=$arg_to_lat,$arg_to_lon";
proxy_cache_valid 200 10s;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
add_header X-Cache-Status $upstream_cache_status always;
include /etc/nginx/snippets/security-headers.conf;  # add_header trong location không kế thừa từ server
