# nginx: phục vụ giao diện + reverse proxy /api, /ws tới backend.
# Tệp nằm trong conf.d (ngữ cảnh http) nên khai báo được cache, map, gzip ở đầu tệp.
# Snippet dùng chung: frontend/nginx/ → /etc/nginx/snippets/ (real-ip.conf có thể thay khi triển khai — README.md mục 10).

# IP thật của người dùng khi có proxy/CDN phía trước (Caddy, HAProxy, Cloudflare…)
include /etc/nginx/snippets/real-ip.conf;

# Cache ngắn cho API công khai: lúc thiên tai hàng chục nghìn người mở cổng cùng lúc, mỗi URL chỉ tạo ~1 yêu cầu/10 giây
# vào backend; backend lỗi hoặc quá tải thì vẫn trả bản gần nhất (stale) thay vì trang lỗi.
proxy_cache_path /var/cache/nginx/public levels=1:2 keys_zone=public_api:20m max_size=512m inactive=24h use_temp_path=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Giữ giao thức gốc khi TLS kết thúc ở proxy phía trước
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

# Log truy cập KHÔNG ghi query string: /ws?token=… chứa JWT, /api/v1/public/locate?lat=… là vị trí người dân
log_format pctt '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                '$request_time "$http_user_agent" cache=$upstream_cache_status';

# Tệp tĩnh đã nén sẵn lúc build (scripts/compress.mjs) → gzip_static gửi thẳng .gz, không tốn CPU nén lại cho từng
# người tải. gzip động chỉ còn dùng cho phản hồi API.
gzip_static on;
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/geo+json application/javascript text/css text/plain text/xml image/svg+xml application/manifest+json;

server {
  listen 80;
  server_tokens off;
  access_log /var/log/nginx/access.log pctt;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 30m;  # phản ánh kèm tối đa 3 ảnh × 8 MB

  include /etc/nginx/snippets/security-headers.conf;

  # API công khai (không đăng nhập): cache 10 giây, trả bản cũ khi backend lỗi. Chỉ GET/HEAD; POST đi thẳng.
  location /api/v1/public/ {
    proxy_pass http://backend:8000;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_cache public_api;
    proxy_cache_methods GET HEAD;
    proxy_cache_key $request_method$request_uri;
    proxy_cache_valid 200 10s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    add_header X-Cache-Status $upstream_cache_status always;
    include /etc/nginx/snippets/security-headers.conf;  # add_header trong location không kế thừa từ server
  }

  location /api/ {
    proxy_pass http://backend:8000;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_read_timeout 120s;
  }

  location = /health {
    proxy_pass http://backend:8000;
    include /etc/nginx/snippets/proxy-headers.conf;
  }

  location /ws {
    proxy_pass http://backend:8000;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # File build của Vite có mã băm trong tên → cache lâu trên trình duyệt / CDN
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Bản đồ nền tự lưu trữ (deploy/fetch-basemap.sh → data/tiles, gắn vào bằng volume — README mục 6.9). Trình duyệt
  # đọc từng đoạn tệp .pmtiles bằng HTTP Range → không gzip (nén động bỏ qua Range); ô bản đồ bên trong đã nén sẵn.
  # Thay tệp mới (mv) thì ETag đổi, thư viện pmtiles tự tải lại phần đầu tệp.
  location /tiles/ {
    try_files $uri =404;
    gzip off;
    gzip_static off;
    expires 1d;
  }

  # index.html luôn kiểm tra lại để người dùng nhận bản mới ngay sau khi triển khai
  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri /index.html;
  }
}
