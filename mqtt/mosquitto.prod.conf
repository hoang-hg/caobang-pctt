# Mosquitto khi TRIỂN KHAI THẬT (docker-compose.prod.yml, profile "mqtt"). Tạo tài khoản & ACL: README.md mục 6.5.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Nội bộ mạng docker: worker của hệ thống kết nối mqtt://<user>:<pass>@mqtt:1883 (cổng này KHÔNG mở ra ngoài)
listener 1883

# Thiết bị hiện trường qua Internet: bắt buộc TLS
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
